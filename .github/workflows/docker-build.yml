name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - master
      - develop

jobs:
  build-and-push:
    name: Build and Push to GHCR
    runs-on: self-hosted
    permissions:
      actions: read
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
      - name: Build and push Docker image
        uses: elepay-io/.github/.github/actions/docker-build@master
        with:
          enable_cross_platform: 'false'
          image_name: ${{ github.repository }}
          build_args: GH_PACKAGES_TOKEN=${{ secrets.PACKAGE_READ_TOKEN }}

      - name: Deploy to server
        uses: elepay-io/.github/.github/actions/deploy-docker@master
        with:
          pat_token: ${{ secrets.DEPLOY_PAT_TOKEN }}
