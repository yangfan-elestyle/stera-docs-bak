# 发布模型 (GHCR 镜像 + ele-iac Ansible):
#   本 workflow 只构建并推送 ghcr.io/<owner>/<repo>, 标签含 master / sha-<sha>; 不负责部署。
#   发版 = ele-iac PR 把 `ansible/roles/business/stera-docs` 的镜像 digest 改成本次构建的 digest
#   (digest 见 job summary), 合并后 ansible-deploy 落到 office-server-02。
#
# 触发: push master (仅靠 PR merge 流入) + 手动 workflow_dispatch。
# runs-on self-hosted = elepay-io 组织 runner。
# 无需额外 Secrets: GHCR 推送用 github.token (packages: write)。
#
# 单租户站点 (stera smart one / SMCC); 入口层须透传原始 Host,
# OG / canonical / llms 的绝对 URL 由请求 Host 生成。

name: Build Docker Image

on:
  push:
    branches: [master]
  workflow_dispatch:

# 同分支串行, 避免并发推送同一 tag。
concurrency:
  group: docker-build-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & Push
    runs-on: self-hosted
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Build and push Docker image
        uses: elepay-io/.github/.github/actions/docker-build@master
        with:
          enable_cross_platform: 'false'
          image_name: ${{ github.repository }}

      # ele-iac role 按 digest 钉镜像; 写进 summary 供发版 PR 直接复制。
      - name: Record image digest
        env:
          IMAGE: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE" --format '{{.Manifest.Digest}}')
          echo "### Image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository }}@${digest}\`" >> "$GITHUB_STEP_SUMMARY"
