openapi: 3.1.0
info:
  version: 1.3.0
  title: elepay API 参考文档
  description: elepay API 是基于 REST 构建的支付 API，可执行支付处理、退款处理等与支付运营相关的各类操作。
  contact:
    name: ELESTYLE, INC
    url: https://elepay.io
    email: support@elestyle.jp
servers:
  - url: https://api.elepay.io
tags:
  - name: Charge
  - name: Refund
  - name: Customer
  - name: Code
  - name: CodeSetting
  - name: PaymentMethod
  - name: Terminal
  - name: Invoice
  - name: Dispute
  - name: Subscription
  - name: Location
security:
  - bearerAuth: []
  - basicAuth: []
paths:
  /charges:
    get:
      tags:
        - Charge
      summary: List charges
      description: 获取支付（Charge）信息列表。
      operationId: listCharges
      parameters:
        - name: paymentMethod
          description: 支付方式（可指定多个）
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentMethodType'
        - name: from
          description: 开始时间（Epoch 毫秒），获取在指定时间之后（含）创建的数据。
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          description: 结束时间（Epoch 毫秒），获取在指定时间之前（含）创建的数据。
          in: query
          schema:
            type: integer
            format: int64
        - name: dateField
          description: |
            指定开始时间与结束时间对应的字段。
            - paid_time 支付时间
            - create_time 支付创建时间
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeDateTimeType'
        - name: status
          description: 支付状态
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeStatusType'
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
        - name: sort
          description: |
            排序字段
            - paid_time 支付时间
            - create_time 支付创建时间
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeDateTimeType'
        - name: order
          description: |
            排序顺序
            - desc 降序
            - asc 升序
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortOrderType'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargesResponse'
    post:
      tags:
        - Charge
      summary: Create charge
      description: 执行支付处理（创建 Charge）。
      operationId: createCharge
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeReq'
        description: 支付请求
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}:
    get:
      tags:
        - Charge
      summary: Retrieve charge
      description: 获取支付（Charge）详情信息。
      operationId: retrieveCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/revoke:
    post:
      tags:
        - Charge
      summary: Revoke charge
      description: 取消支付（Charge）。
      operationId: revokeCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/capture:
    post:
      tags:
        - Charge
      summary: Capture charge
      description: 确认支付（Capture Charge）。
      operationId: captureCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeCaptureReq'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/status:
    get:
      tags:
        - Charge
      summary: Retrieve charge's status
      description: 获取支付（Charge）状态的详细信息。
      operationId: retrieveChargeStatus
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeStatusDto'
  /charges/{id}/refunds:
    get:
      tags:
        - Refund
      summary: List refunds
      description: 获取退款信息列表。
      operationId: listChargesRefunds
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundsResponse'
    post:
      tags:
        - Refund
      summary: Create refund
      description: 对支付进行全额或部分退款处理。
      operationId: createRefund
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/RefundReq'
        description: 退款详情信息
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundDto'
  /charges/{id}/refunds/{refundId}:
    get:
      tags:
        - Refund
      summary: Retrieve refund
      description: 获取退款详情信息。
      operationId: retrieveChargeRefund
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
        - name: refundId
          description: Refund ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundDto'
  /customers:
    get:
      tags:
        - Customer
      summary: List customers
      description: 获取客户信息列表。
      operationId: listCustomers
      parameters:
        - name: keyword
          description: 关键字
          in: query
          required: false
          schema:
            type: string
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
    post:
      tags:
        - Customer
      summary: Create customer
      description: 创建客户。
      operationId: createCustomer
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CustomerReq'
        description: 客户请求
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
  /customers/{customerId}:
    get:
      tags:
        - Customer
      summary: Retrieve customer
      description: 获取客户信息。
      operationId: retrieveCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
    post:
      tags:
        - Customer
      summary: Update customer
      description: 更新客户。
      operationId: updateCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CustomerUpdateReq'
        description: 客户请求
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
    delete:
      tags:
        - Customer
      summary: Delete customer
      description: 删除客户。
      operationId: deleteCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /customers/{customerId}/sources:
    get:
      tags:
        - Customer
      summary: List sources by customer ID
      description: 获取客户来源（Source）信息列表。
      operationId: listSources
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
        - name: paymentMethod
          description: 支付方式
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentMethodType'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceResponse'
    post:
      tags:
        - Customer
      summary: Create source
      description: 创建客户来源（Source）。
      operationId: createSource
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/SourceReq'
        description: 客户来源（Source）请求
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceDto'
  /customers/{customerId}/sources/{sourceId}:
    get:
      tags:
        - Customer
      summary: Retrieve source
      description: 获取客户信息。
      operationId: retrieveSource
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
        - name: sourceId
          description: Source ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceDto'
    delete:
      tags:
        - Customer
      summary: Delete source
      description: 删除客户来源（Source）。
      operationId: deleteSource
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
        - name: sourceId
          description: Source ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /sources/{sourceId}/status:
    get:
      tags:
        - Customer
      summary: Retrieve source's status
      description: 获取客户来源（Source）状态的详细信息。
      operationId: retrieveSourceStatus
      parameters:
        - name: sourceId
          description: Source ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceStatusDto'
  /payment-methods:
    get:
      tags:
        - PaymentMethod
      summary: List supported payment methods
      description: 获取可用的支付方式。
      operationId: listPaymentMethods
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
  /codes:
    post:
      tags:
        - Code
      summary: Create EasyQR code
      description: 创建 EasyQR 码。
      operationId: createCode
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CodeReq'
        description: EasyQR 码请求
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CodeDto'
  /codes/{codeId}:
    get:
      tags:
        - Code
      summary: Retrieve EasyQR code
      description: 获取 EasyQR 码对象。
      operationId: retrieveCode
      parameters:
        - name: codeId
          description: EasyQR 码
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CodeDto'
    delete:
      tags:
        - Code
      summary: Close EasyQR code
      description: 删除 EasyQR 码。
      operationId: closeCode
      parameters:
        - name: codeId
          description: EasyQR 码
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Closed
  /code-setting/payment-methods:
    get:
      tags:
        - CodeSetting
      summary: List all enabled EasyQR payment methods
      description: 获取 EasyQR 可用的支付方式。
      operationId: listCodePaymentMethods
      responses:
        '200':
          description: EasyQR 可用支付方式列表
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CodePaymentMethodResponse'
  /invoices:
    get:
      tags:
        - Invoice
      summary: List invoices
      description: 获取发票信息列表。
      operationId: listInvoices
      parameters:
        - name: keyword
          description: 关键字
          in: query
          required: false
          schema:
            type: string
        - name: from
          description: 开始时间（Epoch 毫秒），获取在指定时间之后（含）创建的数据。
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: to
          description: 结束时间（Epoch 毫秒），获取在指定时间之前（含）创建的数据。
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          description: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/InvoiceStatusType'
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoicesResponse'
    post:
      tags:
        - Invoice
      summary: Create invoice
      description: 创建发票。
      operationId: createInvoice
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/InvoiceReq'
        description: 发票请求
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}:
    get:
      tags:
        - Invoice
      summary: Retrieve invoice
      description: 获取发票信息。
      operationId: retrieveInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
    post:
      tags:
        - Invoice
      summary: Update invoice
      description: 更新发票信息。
      operationId: updateInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/InvoiceReq'
        description: 发票请求
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}/cancel:
    post:
      tags:
        - Invoice
      summary: Cancel invoice
      description: 取消发票。
      operationId: cancelInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}/submit:
    post:
      tags:
        - Invoice
      summary: Submit invoice
      description: 确认发票。
      operationId: submitInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}/send:
    post:
      tags:
        - Invoice
      summary: 发送发票
      description: 发送发票。
      operationId: sendInvoice
      parameters:
        - name: invoiceId
          description: 发票 ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accept
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /terminal/locations:
    get:
      tags:
        - Terminal
      summary: 获取 Location 列表
      operationId: listLocations
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
  /terminal/readers:
    get:
      tags:
        - Terminal
      summary: 获取读卡器列表
      operationId: listReaders
      parameters:
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/TerminalReadersResponse'
    post:
      tags:
        - Terminal
      summary: 创建终端读卡器
      operationId: createReader
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/TerminalReaderReq'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/TerminalReaderDto'
  /terminal/readers/{readerId}:
    get:
      tags:
        - Terminal
      summary: 获取读卡器
      operationId: getReader
      parameters:
        - name: readerId
          description: 读卡器 ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/TerminalReaderDto'
    delete:
      tags:
        - Terminal
      summary: 删除读卡器
      operationId: deleteReader
      parameters:
        - name: readerId
          description: 读卡器 ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /disputes:
    get:
      tags:
        - Dispute
      summary: List disputes
      description: 获取争议（Dispute）信息列表。
      operationId: listDisputes
      parameters:
        - name: chargeId
          description: Charge ID
          in: query
          required: false
          schema:
            type: string
        - name: from
          description: 开始时间（Epoch 毫秒），获取在指定时间之后（含）创建的数据。
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          description: 结束时间（Epoch 毫秒），获取在指定时间之前（含）创建的数据。
          in: query
          schema:
            type: integer
            format: int64
        - name: dateField
          description: |
            指定开始时间与结束时间对应的字段。
            - resolved_time 争议解决时间
            - create_time 争议发生时间
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeDateTimeType'
        - name: status
          description: 争议状态
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeStatusType'
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
        - name: sort
          description: |
            排序字段
            - resolved_time 争议解决时间
            - create_time 支付创建时间
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeDateTimeType'
        - name: order
          description: |
            排序顺序
            - desc 降序
            - asc 升序
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortOrderType'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/DisputesResponse'
  /disputes/{id}:
    get:
      tags:
        - Dispute
      summary: Retrieve dispute
      description: 获取争议（Dispute）详情信息。
      operationId: retrieveDispute
      parameters:
        - name: id
          description: Dispute ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/DisputeDto'
  /subscriptions:
    get:
      tags:
        - Subscription
      summary: List subscriptions
      description: 获取订阅（定期扣款）列表。
      operationId: listSubscriptions
      parameters:
        - name: customerId
          description: Customer ID
          in: query
          required: false
          schema:
            type: string
        - name: from
          description: 开始时间（Epoch 毫秒），获取在指定时间之后（含）创建的数据。
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          description: 结束时间（Epoch 毫秒），获取在指定时间之前（含）创建的数据。
          in: query
          schema:
            type: integer
            format: int64
        - name: status
          description: 订阅状态
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SubscriptionStatusType'
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionsResponse'
    post:
      tags:
        - Subscription
      summary: Create subscription
      description: 创建订阅（定期扣款）。
      operationId: createSubscription
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/SubscriptionReq'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /subscriptions/{subscriptionId}:
    get:
      tags:
        - Subscription
      summary: Retrieve subscription
      description: 获取订阅（定期扣款）信息。
      operationId: retrieveSubscription
      parameters:
        - name: subscriptionId
          description: Subscription ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
    post:
      tags:
        - Subscription
      summary: Update subscription
      description: 更新订阅（定期扣款）。
      operationId: updateSubscription
      parameters:
        - name: subscriptionId
          description: Subscription ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/SubscriptionUpdateReq'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /subscriptions/{subscriptionId}/start:
    post:
      tags:
        - Subscription
      summary: Start subscription
      description: |
        启动新的（status=new）订阅（定期扣款）。
      operationId: startSubscription
      parameters:
        - name: subscriptionId
          description: Subscription ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /subscriptions/{subscriptionId}/resume:
    post:
      tags:
        - Subscription
      summary: Resume subscription
      description: |
        重新启动逾期（status=past_due）的订阅（定期扣款）。
      operationId: resumeSubscription
      parameters:
        - name: subscriptionId
          description: Subscription ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /subscriptions/{subscriptionId}/cancel:
    post:
      tags:
        - Subscription
      summary: Cancel subscription
      description: |
        取消订阅，并在当前周期结束日终止订阅。
        已取消的订阅无法再次启动。
        处理中（processing）的订阅无法取消。
      operationId: cancelSubscription
      parameters:
        - name: subscriptionId
          description: Subscription ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionDto'
  /subscriptions/{subscriptionId}/periods:
    get:
      tags:
        - Subscription
      summary: List subscription periods
      description: 获取订阅周期信息列表。
      operationId: listSubscriptionPeriods
      parameters:
        - name: subscriptionId
          description: Subscription ID
          in: path
          required: true
          schema:
            type: string
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SubscriptionPeriodsResponse'
  /locations:
    get:
      tags:
        - Location
      summary: List locations
      description: 获取 Location 信息列表。
      operationId: listChargeLocations
      parameters:
        - name: limit
          description: 最大条数
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            maximum: 100
            default: 20
        - name: offset
          description: 查询起始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeLocationsResponse'
    post:
      tags:
        - Location
      summary: Create location
