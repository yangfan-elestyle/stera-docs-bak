      operationId: createChargeLocation
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeLocationReq'
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeLocationDto'
  /locations/{locationId}:
    get:
      tags:
        - Location
      summary: Retrieve location
      description: 获取 Location 信息。
      operationId: retrieveChargeLocation
      parameters:
        - name: locationId
          description: Location ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeLocationDto'
    post:
      tags:
        - Location
      summary: Update location
      description: 更新 Location 信息。
      operationId: updateChargeLocation
      parameters:
        - name: locationId
          description: Location ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeLocationUpdateReq'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeLocationDto'
    delete:
      tags:
        - Location
      summary: Delete location
      description: 删除 Location。
      operationId: deleteChargeLocation
      parameters:
        - name: locationId
          description: Location ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        API 调用的认证将密钥作为用户名，省略密码，通过 Basic 认证进行。
        密钥是可执行所有 API 请求操作的重要密钥，请妥善保管。
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API 调用的认证将密钥作为认证 Token，通过 Bearer 认证进行。
        密钥是可执行所有 API 请求操作的重要密钥，请妥善保管。
  schemas:
    PaymentMethodType:
      description: |
        支付方式
        - auto 自动识别（仅 CPM 支付可用）
        - alipay 支付宝
        - alipayhk 支付宝香港
        - alipayplus Alipay+
        - amazonpay Amazon Pay
        - applepay Apple Pay
        - applepay_cn Apple Pay（中国）
        - atokara Atokara
        - atone atone（便利店次月付）
        - aupay au Pay
        - clicktopay Click To Pay
        - banktransfer 银行转账
        - creditcard 信用卡
        - dana DANA
        - docomopay d 支付
        - ezlink EZ-Link
        - felica 电子货币
        - felica_id iD
        - felica_quickpay QUICPay
        - felica_transport_ic 交通系 IC 卡
        - gcash GCash
        - ginkopay 银行 Pay
        - googlepay Google Pay
        - jcoinpay J-Coin Pay
        - jkopay JKOPAY
        - kakaopay Kakao Pay
        - konbini 便利店支付
        - linepay LINE Pay
        - merpay Merpay
        - origamipay Origami Pay
        - paidy Paidy 次月付
        - paypal PayPal
        - paypay PayPay
        - pxpayplus 全支付
        - rakutenpay 乐天 Pay
        - smartcode Smart Code
        - tng Touch 'n Go eWallet
        - truemoney TrueMoney
        - unionpay 云闪付
        - wechatpay Wechat Pay
        - aeonpay AEON Pay
        - rabbitlinepay Rabbit LINE Pay
        - bpi BPI
        - boost Boost
        - hellomoney HelloMoney by AUB
        - tosspay Toss Pay
        - naverpay Naver Pay
        - wellwa WellWa Points
        - grabpay Grab Pay
        - momopay Momo Pay
        - promptpay Prompt Pay
        - wovenpay Woven City Pay
        - ezopay EZO Pay
      type: string
      enum:
        - alipay
        - alipayhk
        - alipayplus
        - amazonpay
        - applepay
        - applepay_cn
        - atokara
        - atone
        - aupay
        - clicktopay
        - banktransfer
        - creditcard
        - dana
        - docomopay
        - ezlink
        - felica
        - felica_id
        - felica_quickpay
        - felica_transport_ic
        - gcash
        - ginkopay
        - googlepay
        - jcoinpay
        - jkopay
        - kakaopay
        - konbini
        - linepay
        - merpay
        - origamipay
        - paidy
        - paypal
        - paypay
        - pxpayplus
        - rakutenpay
        - smartcode
        - tng
        - truemoney
        - unionpay
        - wechatpay
        - aeonpay
        - rabbitlinepay
        - bpi
        - boost
        - hellomoney
        - tosspay
        - naverpay
        - wellwa
        - grabpay
        - momopay
        - promptpay
        - wovenpay
        - ezopay
        - auto
    ResourceType:
      description: |
        支付资源
        - web Web 浏览器
        - ios iOS 原生应用
        - android Android 原生应用
        - liff LINE LIFF 应用
        - mini 微信小程序
        - cpm CPM 支付，用户出示型二维码
        - mpm MPM 支付，门店出示型二维码
        - reader 刷卡机支付（需要读卡器设备）
        - posapp POS 应用支付（需要与 POS 应用集成）
      type: string
      enum:
        - web
        - ios
        - android
        - liff
        - mini
        - cpm
        - mpm
        - reader
        - posapp
    CardBrandType:
      description: |
        - unknown
        - visa
        - mastercard
        - amex
        - jcb
        - diners
        - unionpay
        - discover
        - felica
        - seven_eleven
        - lawson
        - familymart
        - ministop
        - seicomart
      type: string
    ChargeDateTimeType:
      description: 时间字段
      type: string
      enum:
        - paid_time
        - create_time
      default: create_time
    DisputeDateTimeType:
      description: 时间字段
      type: string
      enum:
        - resolved_time
        - create_time
      default: create_time
    SortOrderType:
      description: 排序顺序
      type: string
      enum:
        - desc
        - asc
      default: desc
    ChargeStatusType:
      description: |
        支付状态
        - pending 未支付
        - waiting 等待支付（信息已输入）
        - notified 支付准备中（已通知）
        - uncaptured 已授权（未确认）
        - captured 已支付
        - partially_refunded 部分退款
        - refunded 已退款
        - amount_mismatch 金额不一致
        - revoked 已取消
        - failed 支付失败
      type: string
      enum:
        - pending
        - waiting
        - notified
        - uncaptured
        - captured
        - partially_refunded
        - refunded
        - amount_mismatch
        - revoked
        - failed
    RefundStatusType:
      description: |
        退款状态
        - pending 未退款
        - refunded 已退款
      type: string
      enum:
        - pending
        - refunded
    CodeStatusType:
      description: |
        EasyQR 码状态
        - pending 未支付
        - completed 支付信息准备完成
        - captured 已支付
        - closed 已过期或已删除
      type: string
      enum:
        - pending
        - completed
        - captured
        - closed
    ChargeReq:
      type: object
      description: 支付请求
      required:
        - amount
        - paymentMethod
        - orderNo
      properties:
        amount:
          description: 金额
          type: integer
        capture:
          description: |
            是否确认（capture）支付。
            当为 false 时，仅进行授权并冻结支付金额。默认值为 true。
          type: boolean
          default: true
        currency:
          description: 货币代码（ISO 4217）
          type: string
          minLength: 3
          maxLength: 3
          default: JPY
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodType'
        resource:
          $ref: '#/components/schemas/ResourceType'
        orderNo:
          description: |
            商户系统订单号（例如：订单号、支付 ID 等）。
            最大长度为 50 个字符。
          type: string
          maxLength: 50
        description:
          description: 支付说明
          type: string
          maxLength: 1024
        extra:
          description: 若有与支付相关的附加信息时使用。具体设置请参阅“开发指南->支付 Extra 信息设置”。
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        metadata:
          description: |
            元数据
            任意的键值对数据。
            Key 最多 20 个，Value 为不超过 255 字节的字符串。
            以“route”“__”开头的字符串为保留 Key。
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        clientIp:
          description: Client IP 地址
          type: string
          maxLength: 39
        customerId:
          description: 客户 ID
          type: string
          maxLength: 32
        sourceId:
          description: 客户来源（Source）ID
          type: string
          maxLength: 32
        locationId:
          description: Location ID
          type: string
          maxLength: 32
    ChargeDto:
      type: object
      description: 支付对象
      properties:
        id:
          description: Charge ID
          type: string
          maxLength: 32
        appId:
          description: App ID
          type: string
          maxLength: 32
        object:
          description: 对象类型标识
          type: string
          default: charge
        liveMode:
          description: |
            是否为生产模式
            - false 测试模式
            - true 生产模式
          type: boolean
        amount:
          description: 支付金额
          type: integer
        authorizeAmount:
          description: 预授权金额
          type: integer
        currency:
          description: 货币代码（ISO 4217）
          type: string
          minLength: 3
          maxLength: 3
          default: JPY
        authorize:
          description: 预授权标志
          type: boolean
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodType'
        resource:
          $ref: '#/components/schemas/ResourceType'
        orderNo:
          description: 商户系统订单号，例如订单号、支付 ID 等
          type: string
          maxLength: 50
        description:
          description: 支付说明
          type: string
          maxLength: 1024
        location:
          $ref: '#/components/schemas/ChargeLocationDto'
        extra:
          description: 支付 Extra 数据
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        metadata:
          description: 支付元数据
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        cardInfo:
          $ref: '#/components/schemas/CardInfo'
        voucherNo:
          description: 支付服务商支付凭证号
          type: string
          maxLength: 32
        clientIp:
          description: Client IP 地址
          type: string
          maxLength: 45
        paid:
          description: 已支付标志
          type: boolean
        refunded:
          description: 已退款标志
          type: boolean
        disputed:
          description: 争议标志
          type: boolean
        refunds:
          $ref: '#/components/schemas/RefundsDto'
        status:
          $ref: '#/components/schemas/ChargeStatusType'
        codeContent:
          description: 门店出示型二维码（仅当 resource 为 mpm 时）
          type: string
        credential:
          description: Client SDK 认证信息
          type: string
        paidTime:
          description: 支付时间（Epoch 毫秒）
          type: integer
          format: int64
        refundTime:
          description: 退款时间（Epoch 毫秒）
          type: integer
          format: int64
        expiryTime:
          description: 支付请求有效期（Epoch 毫秒）
          type: integer
          format: int64
        settleTime:
          description: 支付结算截止时间（Epoch 毫秒）
          type: integer
          format: int64
        createTime:
          description: 支付创建时间（Epoch 毫秒）
          type: integer
          format: int64
    ChargeStatusDto:
      type: object
      description: 支付状态对象
      properties:
        id:
          description: Charge ID
          type: string
          maxLength: 32
        appId:
          description: App ID
          type: string
          maxLength: 32
        liveMode:
          description: |
            是否为生产模式
            - false 测试模式
            - true 生产模式
          type: boolean
        status:
          $ref: '#/components/schemas/ChargeStatusType'
    RefundReq:
      description: 退款请求
      type: object
      required:
        - amount
      properties:
        amount:
          description: 退款金额。可全额退款，亦可通过指定 amount 进行任意金额退款。
          type: integer
        currency:
          description: 货币代码（ISO 4217）
          type: string
          minLength: 3
          maxLength: 3
          default: JPY
        metadata:
          description: 退款元数据
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        reason:
          description: 退款原因
          type: string
          maxLength: 255
    RefundDto:
      description: 退款对象
      type: object
      properties:
        id:
          description: Refund ID
          type: string
          maxLength: 32
        object:
          description: 对象类型标识
          type: string
          default: refund
        chargeId:
          description: Charge ID
          type: string
          maxLength: 32
        liveMode:
          description: |
            是否为生产模式
            - false 测试模式
            - true 生产模式
          type: boolean
        amount:
          description: 退款金额。可全额退款，亦可通过指定 amount 进行部分退款。
          type: integer
        currency:
          description: 货币代码（ISO 4217）
          type: string
          minLength: 3
          maxLength: 3
        metadata:
          description: 退款元数据
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        reason:
          description: 退款原因
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/RefundStatusType'
        refundedTime:
          description: 退款处理时间（Epoch 毫秒）
          type: integer
          format: int64
        createTime:
          description: 退款创建时间（Epoch 毫秒）
          type: integer
          format: int64
    RefundsDto:
      description: 退款汇总。若发生多次退款，将对退款内容进行汇总返回。
      type: object
      properties:
        amount:
          description: 退款总额
          type: integer
        totalCount:
          description: 退款次数
          type: integer
        data:
          description: 退款详情信息
          type: array
          items:
            $ref: '#/components/schemas/RefundDto'
    ChargesResponse:
      description: 支付信息列表
      type: object
      properties:
        total:
          description: 条数
          type: integer
        charges:
          description: 支付详情内容
          type: array
          items:
            $ref: '#/components/schemas/ChargeDto'
    RefundsResponse:
      description: 退款信息列表
      type: object
      properties:
        total:
          description: 条数
          type: integer
        refunds:
          description: 退款详情内容
          type: array
          items:
            $ref: '#/components/schemas/RefundDto'
    DisputesResponse:
      description: 争议信息列表
      type: object
      properties:
        total:
          description: 条数
          type: integer
        disputes:
          description: 争议详情内容
          type: array
          items:
            $ref: '#/components/schemas/DisputeDto'
    DisputeDto:
      description: 争议（Dispute）对象
      type: object
      properties:
        id:
          description: Dispute ID
          type: string
          maxLength: 32
        object:
          description: 对象类型标识
          type: string
          default: dispute
        chargeId:
          description: Charge ID
          type: string
          maxLength: 32
        liveMode:
          description: |
            是否为生产模式
            - false 测试模式
            - true 生产模式
          type: boolean
        amount:
          description: 争议金额
          type: integer
        currency:
          description: 货币代码（ISO 4217）
          type: string
          minLength: 3
          maxLength: 3
        metadata:
          description: 元数据
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        reason:
          description: 争议原因
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/DisputeStatusType'
