  /subscriptions/{subscriptionId}/cancel:
    post:
      tags:
        - Subscription
      summary: Cancel subscription
      description: |
        Cancels the subscription and ends it at the end of the current period.
        A canceled subscription cannot be restarted.
        A subscription that is being processed cannot be canceled.
      operationId: cancelSubscription
      parameters:
        - name: subscriptionId
          description: Subscription ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
