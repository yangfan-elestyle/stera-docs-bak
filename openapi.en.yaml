    ResourceType:
      description: |
        Payment resource
        - web Web browser
        - ios iOS native app
        - android Android native app
        - liff LINE LIFF app
        - mini WeChat Mini Program
        - cpm CPM payment (customer-presented QR code)
        - mpm MPM payment (merchant-presented QR code)
        - reader Card reader payment (reader device required)
        - posapp POS app payment (POS app integration required)
      type: string
      enum:
        - web
        - ios
        - android
        - liff
        - mini
        - cpm
        - mpm
        - reader
        - posapp
    CardBrandType:
      description: |
        - unknown
        - visa
        - mastercard
        - amex
        - jcb
        - diners
        - unionpay
        - discover
        - felica
        - seven_eleven
        - lawson
        - familymart
        - ministop
        - seicomart
      type: string
    ChargeDateTimeType:
      description: Time field
      type: string
      enum:
        - paid_time
        - create_time
      default: create_time
    DisputeDateTimeType:
      description: Time field
      type: string
      enum:
        - resolved_time
        - create_time
      default: create_time
    SortOrderType:
      description: Sort order
      type: string
      enum:
        - desc
        - asc
      default: desc
    ChargeStatusType:
      description: |
        Payment status
        - pending Unpaid
        - waiting Waiting for payment (information entered)
        - notified Preparing for payment (notified)
        - uncaptured Authorized (not captured)
        - captured Paid
        - partially_refunded Partially refunded
        - refunded Refunded
        - amount_mismatch Amount mismatch
        - revoked Canceled
        - failed Payment failed
      type: string
      enum:
        - pending
        - waiting
        - notified
        - uncaptured
        - captured
        - partially_refunded
        - refunded
        - amount_mismatch
        - revoked
        - failed
