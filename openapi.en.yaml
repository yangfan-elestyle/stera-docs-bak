components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        API authentication is performed via Basic auth using the secret key as the username and omitting the password.
        The secret key is a critical key that allows all API operations, so handle it with care.
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API authentication is performed via Bearer auth using the secret key as the bearer token.
        The secret key is a critical key that allows all API operations, so handle it with care.
  schemas:
    PaymentMethodType:
