      description: Deletes an EasyQR code.
      operationId: closeCode
      parameters:
        - name: codeId
          description: EasyQR code
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Closed
  /code-setting/payment-methods:
    get:
      tags:
        - CodeSetting
      summary: List all enabled EasyQR payment methods
      description: Retrieves the payment methods available for EasyQR.
      operationId: listCodePaymentMethods
