          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: Starting offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
    post:
      tags:
        - Customer
      summary: Create customer
      description: Creates a customer.
      operationId: createCustomer
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CustomerReq'
        description: Customer request
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
  /customers/{customerId}:
    get:
      tags:
        - Customer
      summary: Retrieve customer
      description: Retrieves customer information.
      operationId: retrieveCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
    post:
      tags:
        - Customer
      summary: Update customer
      description: Updates a customer.
      operationId: updateCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CustomerUpdateReq'
        description: Customer request
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
    delete:
      tags:
        - Customer
      summary: Delete customer
      description: Deletes a customer.
      operationId: deleteCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /customers/{customerId}/sources:
    get:
      tags:
        - Customer
      summary: List sources by customer ID
      description: Retrieves a list of customer source information.
      operationId: listSources
      parameters:
