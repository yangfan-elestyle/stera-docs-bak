openapi: 3.1.0
info:
  version: 1.3.0
  title: elepay API Reference
  description: The elepay API is a REST-based payment API. It provides various capabilities for payment operations, such as processing payments and refunds.
  contact:
    name: ELESTYLE, INC
    url: https://elepay.io
    email: support@elestyle.jp
servers:
  - url: https://api.elepay.io
tags:
  - name: Charge
  - name: Refund
  - name: Customer
  - name: Code
  - name: CodeSetting
  - name: PaymentMethod
  - name: Terminal
  - name: Invoice
  - name: Dispute
  - name: Subscription
  - name: Location
security:
  - bearerAuth: []
  - basicAuth: []
paths:
  /charges:
    get:
      tags:
        - Charge
      summary: List charges
      description: Retrieves a list of charge information.
      operationId: listCharges
      parameters:
        - name: paymentMethod
          description: Payment method (multiple values can be specified).
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentMethodType'
        - name: from
          description: Start time (epoch millisecond). Retrieves data created on or after the specified time.
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          description: End time (epoch millisecond). Retrieves data created on or before the specified time.
          in: query
          schema:
            type: integer
            format: int64
        - name: dateField
          description: |
            Specifies which fields are used for the start and end times.
            - paid_time Payment time
            - create_time Charge creation time
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeDateTimeType'
        - name: status
          description: Payment status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeStatusType'
        - name: limit
          description: Maximum number of items
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: Starting offset
          in: query
          schema:
            type: integer
            default: 0
        - name: sort
          description: |
            Sort field
            - paid_time Payment time
            - create_time Charge creation time
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeDateTimeType'
        - name: order
          description: |
            Sort order
            - desc Descending
            - asc Ascending
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortOrderType'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargesResponse'
    post:
      tags:
        - Charge
      summary: Create charge
      description: Creates a charge.
      operationId: createCharge
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeReq'
        description: Payment request
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}:
    get:
      tags:
        - Charge
      summary: Retrieve charge
      description: Retrieves detailed information about a charge.
      operationId: retrieveCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/revoke:
    post:
      tags:
        - Charge
      summary: Revoke charge
      description: Cancels a charge.
      operationId: revokeCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/capture:
    post:
      tags:
        - Charge
      summary: Capture charge
      description: Captures a charge.
      operationId: captureCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeCaptureReq'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/status:
    get:
      tags:
        - Charge
      summary: Retrieve charge's status
      description: Retrieves detailed information about a charge's status.
      operationId: retrieveChargeStatus
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeStatusDto'
  /charges/{id}/refunds:
    get:
      tags:
        - Refund
      summary: List refunds
      description: Retrieves a list of refund information.
      operationId: listChargesRefunds
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundsResponse'
    post:
      tags:
        - Refund
      summary: Create refund
      description: Processes a full or partial refund for a charge.
      operationId: createRefund
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/RefundReq'
        description: Refund details
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundDto'
  /charges/{id}/refunds/{refundId}:
    get:
      tags:
        - Refund
      summary: Retrieve refund
      description: Retrieves detailed information about a refund.
      operationId: retrieveChargeRefund
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
        - name: refundId
          description: Refund ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundDto'
  /customers:
    get:
      tags:
        - Customer
      summary: List customers
      description: Retrieves a list of customer information.
      operationId: listCustomers
      parameters:
        - name: keyword
          description: Keyword
          in: query
