      description: |
        Refund status
        - pending Not refunded
        - refunded Refunded
      type: string
      enum:
        - pending
        - refunded
    CodeStatusType:
      description: |
        EasyQR code status
        - pending Unpaid
        - completed Payment information is ready
        - captured Paid
        - closed Expired or deleted
      type: string
      enum:
        - pending
        - completed
        - captured
        - closed
    ChargeReq:
      type: object
      description: Payment request
      required:
        - amount
        - paymentMethod
        - orderNo
      properties:
        amount:
          description: Amount
          type: integer
        capture:
          description: |
            Whether to capture the payment.
            If false, only authorization and amount hold are performed. Default is true.
          type: boolean
          default: true
        currency:
          description: Currency code (ISO 4217)
          type: string
          minLength: 3
          maxLength: 3
          default: JPY
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodType'
        resource:
          $ref: '#/components/schemas/ResourceType'
        orderNo:
          description: |
            Merchant system order number (e.g., order number, payment ID, etc.).
            Maximum length is 50 characters.
          type: string
          maxLength: 50
        description:
          description: Description of the payment
          type: string
          maxLength: 1024
        extra:
          description: Used when there is additional payment-related information. For details, refer to 'Developer Guide -> Payment Extra Information Settings'.
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        metadata:
          description: |
            Metadata
            Arbitrary key-value data.
            Up to 20 keys; values are strings up to 255 bytes.
            Strings beginning with 'route' or '__' are reserved keys.
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        clientIp:
          description: Client IP address
          type: string
          maxLength: 39
        customerId:
          description: Customer ID
          type: string
          maxLength: 32
        sourceId:
          description: Customer source ID
          type: string
          maxLength: 32
        locationId:
          description: Location ID
          type: string
          maxLength: 32
