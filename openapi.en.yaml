        Payment method
        - auto Auto detection (available for CPM payments only)
        - alipay Alipay
        - alipayhk AlipayHK
        - alipayplus Alipay+
        - amazonpay Amazon Pay
        - applepay Apple Pay
        - applepay_cn Apple Pay (China)
        - atokara Atokara
        - atone atone (pay next month at convenience stores)
        - aupay au Pay
        - clicktopay Click To Pay
        - banktransfer Bank transfer
        - creditcard Credit card
        - dana DANA
        - docomopay d Payment
        - ezlink EZ-Link
        - felica E-money
        - felica_id iD
        - felica_quickpay QUICPay
        - felica_transport_ic Transit IC card
        - gcash GCash
        - ginkopay Bank Pay
        - googlepay Google Pay
        - jcoinpay J-Coin Pay
        - jkopay JKOPAY
        - kakaopay Kakao Pay
        - konbini Convenience store payment
        - linepay LINE Pay
        - merpay Merpay
        - origamipay Origami Pay
        - paidy Paidy (pay next month)
        - paypal PayPal
        - paypay PayPay
        - pxpayplus AllPay
        - rakutenpay Rakuten Pay
        - smartcode Smart Code
        - tng Touch 'n Go eWallet
        - truemoney TrueMoney
        - unionpay UnionPay QuickPass
        - wechatpay Wechat Pay
        - aeonpay AEON Pay
        - rabbitlinepay Rabbit LINE Pay
        - bpi BPI
        - boost Boost
        - hellomoney HelloMoney by AUB
        - tosspay Toss Pay
        - naverpay Naver Pay
        - wellwa WellWa Points
        - grabpay Grab Pay
        - momopay Momo Pay
        - promptpay Prompt Pay
        - wovenpay Woven City Pay
        - ezopay EZO Pay
      type: string
      enum:
        - alipay
        - alipayhk
        - alipayplus
        - amazonpay
        - applepay
        - applepay_cn
        - atokara
        - atone
        - aupay
        - clicktopay
        - banktransfer
        - creditcard
        - dana
        - docomopay
        - ezlink
        - felica
