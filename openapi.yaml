        - amazonpay Amazon Pay
        - applepay Apple Pay
        - applepay_cn Apple Pay(中国)
        - atokara アトカラ
        - atone atone(コンビニで翌月払い)
        - aupay au Pay
        - clicktopay Click To Pay
        - banktransfer 銀行振込
        - creditcard クレジットカード
        - dana DANA
        - docomopay d払い
        - ezlink EZ-Link
        - felica 電子マネー
        - felica_id iD
        - felica_quickpay QUICPay
        - felica_transport_ic 交通系ICカード
        - gcash GCash
        - ginkopay 銀行Pay
        - googlepay Google Pay
        - jcoinpay J-Coin Pay
        - jkopay JKOPAY
        - kakaopay Kakao Pay
        - konbini コンビニ決済
        - linepay LINE Pay
        - merpay メルペイ
        - origamipay Origami Pay
        - paidy Paidy 翌月払い
        - paypal PayPal
        - paypay PayPay
        - pxpayplus 全支付
        - rakutenpay 楽天ペイ
        - smartcode スマートコード
        - tng Touch 'n Go eWallet
        - truemoney TrueMoney
        - unionpay 雲閃付
        - wechatpay Wechat Pay
        - aeonpay AEON Pay
        - rabbitlinepay Rabbit LINE Pay
        - bpi BPI
        - boost Boost
        - hellomoney HelloMoney by AUB
        - tosspay Toss Pay
        - naverpay Naver Pay
        - wellwa WellWa Points
        - grabpay Grab Pay
        - momopay Momo Pay
        - promptpay Prompt Pay
        - wovenpay Woven City Pay
        - ezopay EZO Pay
      type: string
      enum:
        - alipay
        - alipayhk
        - alipayplus
        - amazonpay
        - applepay
        - applepay_cn
        - atokara
        - atone
        - aupay
        - clicktopay
        - banktransfer
        - creditcard
        - dana
        - docomopay
        - ezlink
        - felica
        - felica_id
        - felica_quickpay
        - felica_transport_ic
        - gcash
        - ginkopay
        - googlepay
        - jcoinpay
        - jkopay
        - kakaopay
        - konbini
        - linepay
        - merpay
        - origamipay
        - paidy
        - paypal
        - paypay
        - pxpayplus
        - rakutenpay
        - smartcode
        - tng
        - truemoney
        - unionpay
        - wechatpay
        - aeonpay
        - rabbitlinepay
        - bpi
        - boost
        - hellomoney
        - tosspay
        - naverpay
        - wellwa
        - grabpay
        - momopay
        - promptpay
        - wovenpay
        - ezopay
        - auto
    ResourceType:
      description: |
        決済リソース
        - web WEBブラウザ
        - ios iOS Nativeアプリ
        - android Android Nativeアプリ
        - liff Line LIFFアプリ
        - mini WeChatミニプログラム
        - cpm CPM決済、利用者提示型QRコード
        - mpm MPM決済、店舗側提示型QRコード
        - reader カードリーダー決済(リーダー設備が必要)
        - posapp POSアプリ決済(POSアプリが連携必要)
      type: string
      enum:
        - web
        - ios
        - android
        - liff
        - mini
        - cpm
        - mpm
        - reader
        - posapp
    CardBrandType:
      description: |
        - unknown
        - visa
        - mastercard
        - amex
        - jcb
        - diners
        - unionpay
        - discover
        - felica
        - seven_eleven
        - lawson
        - familymart
        - ministop
        - seicomart
      type: string
    ChargeDateTimeType:
      description: 時間項目
      type: string
      enum:
        - paid_time
        - create_time
      default: create_time
    DisputeDateTimeType:
      description: 時間項目
      type: string
      enum:
        - resolved_time
        - create_time
      default: create_time
    SortOrderType:
      description: ソート順
      type: string
      enum:
        - desc
        - asc
      default: desc
    ChargeStatusType:
      description: |
        支払い状態
        - pending 未支払
        - waiting 支払い待ち(情報入力済)
        - notified 支払い準備中(通知済)
        - uncaptured 承認済み(未確定)
        - captured 支払済み
        - partially_refunded 一部返金
        - refunded 返金済み
        - amount_mismatch 金額相違
        - revoked キャンセル済み
        - failed 支払い失敗
      type: string
      enum:
        - pending
        - waiting
        - notified
        - uncaptured
        - captured
        - partially_refunded
        - refunded
        - amount_mismatch
        - revoked
        - failed
    RefundStatusType:
      description: |
        返金状態
        - pending 未返金
        - refunded 返金済み
      type: string
      enum:
        - pending
        - refunded
    CodeStatusType:
      description: |
        EasyQrコード状態
        - pending 未支払
        - completed 支払い情報の準備が完了
        - captured 支払済み
        - closed 有効期限切れ・削除された
      type: string
      enum:
        - pending
        - completed
        - captured
        - closed
    ChargeReq:
      type: object
      description: 支払リクエスト
      required:
        - amount
        - paymentMethod
        - orderNo
      properties:
        amount:
          description: 金額
          type: integer
        capture:
          description: |
            支払い処理を確定するかどうか
            falseの場合、承認と支払い額の確保のみ行う。デフォルトはtrue
          type: boolean
          default: true
        currency:
          description: 通貨コード (ISO_4217)
          type: string
          minLength: 3
          maxLength: 3
          default: JPY
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodType'
        resource:
          $ref: '#/components/schemas/ResourceType'
        orderNo:
          description: |
            お客様側のシステムオーダーNo（例：注文番号、決済IDなど）
            最大桁数は50桁です。
          type: string
          maxLength: 50
        description:
          description: 決済に関する説明
          type: string
          maxLength: 1024
        extra:
          description: 決済に関する追加情報がある場合に利用します。具体的設定情報は「開発ガイド->決済Extra情報設定」を参照してください。
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        metadata:
          description: |
            メタデータ
            キーバリューの任意データ。
            キーは20個まで、バリューは255バイト以内の文字列。
            「route」、「__」で始まる文字列は予約キー。
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        clientIp:
          description: Client IP アドレス
          type: string
          maxLength: 39
        customerId:
          description: カスタマID
          type: string
          maxLength: 32
        sourceId:
          description: カスタマソースID
          type: string
          maxLength: 32
        locationId:
          description: ロケーションID
          type: string
          maxLength: 32
    ChargeDto:
      type: object
      description: 支払いオブジェクト
      properties:
        id:
          description: Charge ID
          type: string
          maxLength: 32
        appId:
          description: App ID
          type: string
          maxLength: 32
        object:
          description: 対象種類の表記
          type: string
          default: charge
        liveMode:
          description: |
            本番モードかどうか
            - false テストモード
            - true 本番モード
          type: boolean
        amount:
          description: 支払い金額
          type: integer
        authorizeAmount:
          description: 事前承認金額
          type: integer
        currency:
          description: 通貨コード (ISO_4217)
          type: string
          minLength: 3
          maxLength: 3
          default: JPY
        authorize:
          description: 事前承認フラグ
          type: boolean
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodType'
        resource:
          $ref: '#/components/schemas/ResourceType'
        orderNo:
          description: お客様システム側のオーダーNo、例えば注文番号、決済IDなど
          type: string
          maxLength: 50
        description:
          description: 支払い説明文
          type: string
          maxLength: 1024
        location:
          $ref: '#/components/schemas/ChargeLocationDto'
        extra:
          description: 支払いエキストラデータ
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        metadata:
          description: 支払いメタデータ
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        cardInfo:
          $ref: '#/components/schemas/CardInfo'
        voucherNo:
          description: プロバイダー決済伝票番号
          type: string
          maxLength: 32
        clientIp:
          description: Client IP アドレス
          type: string
          maxLength: 45
        paid:
          description: 支払い済みフラグ
          type: boolean
        refunded:
          description: 返金済みフラグ
          type: boolean
        disputed:
          description: 不審請求フラグ
          type: boolean
        refunds:
          $ref: '#/components/schemas/RefundsDto'
        status:
          $ref: '#/components/schemas/ChargeStatusType'
        codeContent:
          description: 店舗側提示型QRコード(リソースはmpm場合のみ)
          type: string
        credential:
          description: Client SDKの認証情報
          type: string
        paidTime:
          description: 支払い時間（エポックミリ秒）
          type: integer
          format: int64
        refundTime:
          description: 返金時間（エポックミリ秒）
          type: integer
          format: int64
        expiryTime:
          description: 支払い請求有効時間（エポックミリ秒）
          type: integer
          format: int64
        settleTime:
          description: 支払い締め時間（エポックミリ秒）
          type: integer
          format: int64
        createTime:
          description: 支払い新規時間（エポックミリ秒）
          type: integer
          format: int64
    ChargeStatusDto:
      type: object
      description: 支払いステータスオブジェクト
      properties:
        id:
          description: Charge ID
          type: string
          maxLength: 32
        appId:
          description: App ID
          type: string
          maxLength: 32
        liveMode:
          description: |
            本番モードかどうか
            - false テストモード
            - true 本番モード
          type: boolean
        status:
          $ref: '#/components/schemas/ChargeStatusType'
    RefundReq:
      description: 返金リクエスト
      type: object
      required:
        - amount
      properties:
        amount:
          description: 返金額。全額返金、及び amount の指定で任意の金額で返金ができます。
          type: integer
        currency:
          description: 通貨コード (ISO_4217)
          type: string
          minLength: 3
          maxLength: 3
          default: JPY
        metadata:
          description: 返金メタデータ
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        reason:
          description: 返金理由
          type: string
          maxLength: 255
    RefundDto:
      description: 返金オブジェクト
      type: object
      properties:
        id:
          description: Refund ID
          type: string
          maxLength: 32
        object:
          description: 対象種類の表記
          type: string
          default: refund
        chargeId:
          description: Charge ID
          type: string
          maxLength: 32
        liveMode:
          description: |
            本番モードかどうか
            - false テストモード
            - true 本番モード
          type: boolean
        amount:
          description: 返金金額。全額返金、及び amount を指定することで金額の部分返金を行うことができます。
          type: integer
        currency:
          description: 通貨コード (ISO_4217)
          type: string
          minLength: 3
          maxLength: 3
        metadata:
          description: 返金メタデータ
          type: object
          maxProperties: 20
          propertyNames:
            type: string
            maxLength: 20
          additionalProperties:
            type: string
        reason:
          description: 返金理由
          type: string
          maxLength: 255
        status:
          $ref: '#/components/schemas/RefundStatusType'
        refundedTime:
          description: 返金を行う時間（エポックミリ秒）
          type: integer
          format: int64
        createTime:
          description: 返金新規時間（エポックミリ秒）
          type: integer
          format: int64
    RefundsDto:
      description: 返金のサマリー。複数回返金された場合、返金内容をサマリーして返します。
      type: object
      properties:
        amount:
          description: 返金総額
          type: integer
        totalCount:
          description: 返金回数
          type: integer
        data:
          description: 返金詳細情報
          type: array
          items:
            $ref: '#/components/schemas/RefundDto'
    ChargesResponse:
      description: 支払い情報リスト
      type: object
      properties:
        total:
          description: 件数
          type: integer
        charges:
          description: 支払い詳細内容
          type: array
          items:
            $ref: '#/components/schemas/ChargeDto'
    RefundsResponse:
      description: 返金情報リスト
      type: object
      properties:
        total:
          description: 件数
          type: integer
        refunds:
          description: 返金詳細内容
          type: array
          items:
            $ref: '#/components/schemas/RefundDto'
    DisputesResponse:
      description: 不審請求情報リスト
      type: object
      properties:
        total:
          description: 件数
          type: integer
        disputes:
          description: 不審請求詳細内容
          type: array
          items:
            $ref: '#/components/schemas/DisputeDto'
    DisputeDto:
      description: 不審請求オブジェクト
      type: object
      properties:
        id:
          description: Dispute ID
          type: string
          maxLength: 32
        object:
