components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: |
        API呼出すの認証は、秘密鍵をユーザーネームとして扱い、パスワードは省略して、Basic 認証経由で行われます。
        秘密鍵は、全ての API リクエスト操作が可能となる重要なキーなので、取扱いにご注意ください。
    bearerAuth:
      type: http
      scheme: bearer
      description: |
        API呼出すの認証は、秘密鍵を認証トークンとして扱い、Bearer 認証経由で行われます。
        秘密鍵は、全ての API リクエスト操作が可能となる重要なキーなので、取扱いにご注意ください。
  schemas:
    PaymentMethodType:
