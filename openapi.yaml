openapi: 3.1.0
info:
  version: 1.3.0
  title: elepay API リファレンス
  description: elepay APIはRESTをベースに構成された決済APIです。支払い処理、返金処理など、決済に関わる運用における様々なことができます。
  contact:
    name: ELESTYLE, INC
    url: https://elepay.io
    email: support@elestyle.jp
servers:
  - url: https://api.elepay.io
tags:
  - name: Charge
  - name: Refund
  - name: Customer
  - name: Code
  - name: CodeSetting
  - name: PaymentMethod
  - name: Terminal
  - name: Invoice
  - name: Dispute
  - name: Subscription
  - name: Location
security:
  - bearerAuth: []
  - basicAuth: []
paths:
  /charges:
    get:
      tags:
        - Charge
      summary: List charges
      description: 決済に関する情報を一覧で取得します。
      operationId: listCharges
      parameters:
        - name: paymentMethod
          description: 決済方法(複数の指定が可能です)
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/PaymentMethodType'
        - name: from
          description: 開始時間（エポックミリ秒）、指定した時間以降に作成されたデータを取得します
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          description: 終了時間（エポックミリ秒）、指定した時間以前に作成されたデータを取得します
          in: query
          schema:
            type: integer
            format: int64
        - name: dateField
          description: |
            開始時間と終了時間の項目を指定します。
            - paid_time 支払い時間
            - create_time 決済新規時間
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeDateTimeType'
        - name: status
          description: 支払状況
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeStatusType'
        - name: limit
          description: 最大件数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 検索開始位置
          in: query
          schema:
            type: integer
            default: 0
        - name: sort
          description: |
            ソート項目
            - paid_time 支払い時間
            - create_time 決済新規時間
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ChargeDateTimeType'
        - name: order
          description: |
            ソート順
            - desc 降順
            - asc 昇順
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortOrderType'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargesResponse'
    post:
      tags:
        - Charge
      summary: Create charge
      description: 決済処理を行います。
      operationId: createCharge
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeReq'
        description: 支払リクエスト
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}:
    get:
      tags:
        - Charge
      summary: Retrieve charge
      description: 決済に関する詳細情報を取得します。
      operationId: retrieveCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/revoke:
    post:
      tags:
        - Charge
      summary: Revoke charge
      description: 決済を取消します。
      operationId: revokeCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/capture:
    post:
      tags:
        - Charge
      summary: Capture charge
      description: 決済を確定します。
      operationId: captureCharge
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/ChargeCaptureReq'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeDto'
  /charges/{id}/status:
    get:
      tags:
        - Charge
      summary: Retrieve charge's status
      description: 決済のステータスに関する詳細情報を取得します。
      operationId: retrieveChargeStatus
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/ChargeStatusDto'
  /charges/{id}/refunds:
    get:
      tags:
        - Refund
      summary: List refunds
      description: 返金に関する情報を一覧で取得します。
      operationId: listChargesRefunds
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundsResponse'
    post:
      tags:
        - Refund
      summary: Create refund
      description: 決済の全額あるいは一部の返金処理を行います。
      operationId: createRefund
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/RefundReq'
        description: 返金の詳細情報
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundDto'
  /charges/{id}/refunds/{refundId}:
    get:
      tags:
        - Refund
      summary: Retrieve refund
      description: 返金に関する詳細情報を取得します。
      operationId: retrieveChargeRefund
      parameters:
        - name: id
          description: Charge ID
          in: path
          required: true
          schema:
            type: string
        - name: refundId
          description: Refund ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/RefundDto'
  /customers:
    get:
      tags:
        - Customer
      summary: List customers
      description: カスタマ情報を一覧で取得します。
      operationId: listCustomers
      parameters:
        - name: keyword
          description: キーワード
          in: query
          required: false
          schema:
            type: string
        - name: limit
          description: 最大件数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 検索開始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerResponse'
    post:
      tags:
        - Customer
      summary: Create customer
      description: カスタマを作成します。
      operationId: createCustomer
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CustomerReq'
        description: カスタマリクエスト
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
  /customers/{customerId}:
    get:
      tags:
        - Customer
      summary: Retrieve customer
      description: カスタマ情報を取得します。
      operationId: retrieveCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
    post:
      tags:
        - Customer
      summary: Update customer
      description: カスタマを更新します。
      operationId: updateCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CustomerUpdateReq'
        description: カスタマリクエスト
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CustomerDto'
    delete:
      tags:
        - Customer
      summary: Delete customer
      description: カスタマを削除します
      operationId: deleteCustomer
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /customers/{customerId}/sources:
    get:
      tags:
        - Customer
      summary: List sources by customer ID
      description: カスタマソース情報を一覧で取得します。
      operationId: listSources
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
        - name: paymentMethod
          description: 決済方法
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/PaymentMethodType'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceResponse'
    post:
      tags:
        - Customer
      summary: Create source
      description: カスタマソースを作成します。
      operationId: createSource
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/SourceReq'
        description: カスタマソースリクエスト
        required: true
      responses:
        '201':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceDto'
  /customers/{customerId}/sources/{sourceId}:
    get:
      tags:
        - Customer
      summary: Retrieve source
      description: カスタマ情報を取得します。
      operationId: retrieveSource
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
        - name: sourceId
          description: Source ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceDto'
    delete:
      tags:
        - Customer
      summary: Delete source
      description: カスタマソースを削除します。
      operationId: deleteSource
      parameters:
        - name: customerId
          description: Customer ID
          in: path
          required: true
          schema:
            type: string
        - name: sourceId
          description: Source ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /sources/{sourceId}/status:
    get:
      tags:
        - Customer
      summary: Retrieve source's status
      description: カスタマソースのステータスに関する詳細情報を取得します。
      operationId: retrieveSourceStatus
      parameters:
        - name: sourceId
          description: Source ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/SourceStatusDto'
  /payment-methods:
    get:
      tags:
        - PaymentMethod
      summary: List supported payment methods
      description: 利用できる決済方法を取得します。
      operationId: listPaymentMethods
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/PaymentMethodResponse'
  /codes:
    post:
      tags:
        - Code
      summary: Create EasyQR code
      description: EasyQRコードを作成します。
      operationId: createCode
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/CodeReq'
        description: EasyQRコードリクエスト
        required: true
      responses:
        '201':
          description: Created
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CodeDto'
  /codes/{codeId}:
    get:
      tags:
        - Code
      summary: Retrieve EasyQR code
      description: EasyQRコードオブジェクトを取得する
      operationId: retrieveCode
      parameters:
        - name: codeId
          description: EasyQRコード
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CodeDto'
    delete:
      tags:
        - Code
      summary: Close EasyQR code
      description: EasyQRコードを削除します
      operationId: closeCode
      parameters:
        - name: codeId
          description: EasyQRコード
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Closed
  /code-setting/payment-methods:
    get:
      tags:
        - CodeSetting
      summary: List all enabled EasyQR payment methods
      description: EasyQR利用できる決済方法を取得します。
      operationId: listCodePaymentMethods
      responses:
        '200':
          description: EasyQR利用できる決済方法リスト
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/CodePaymentMethodResponse'
  /invoices:
    get:
      tags:
        - Invoice
      summary: List invoices
      description: インボイス情報を一覧で取得します。
      operationId: listInvoices
      parameters:
        - name: keyword
          description: キーワード
          in: query
          required: false
          schema:
            type: string
        - name: from
          description: 開始時間（エポックミリ秒）、指定した時間以降に作成されたデータを取得します
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: to
          description: 終了時間（エポックミリ秒）、指定した時間以前に作成されたデータを取得します
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: status
          description: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: '#/components/schemas/InvoiceStatusType'
        - name: limit
          description: 最大件数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 検索開始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoicesResponse'
    post:
      tags:
        - Invoice
      summary: Create invoice
      description: インボイスを作成します。
      operationId: createInvoice
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/InvoiceReq'
        description: インボイスリクエスト
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}:
    get:
      tags:
        - Invoice
      summary: Retrieve invoice
      description: インボイス情報を取得します。
      operationId: retrieveInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
    post:
      tags:
        - Invoice
      summary: Update invoice
      description: インボイス情報を更新します。
      operationId: updateInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/InvoiceReq'
        description: インボイスリクエスト
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}/cancel:
    post:
      tags:
        - Invoice
      summary: Cancel invoice
      description: インボイスを中止します。
      operationId: cancelInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}/submit:
    post:
      tags:
        - Invoice
      summary: Submit invoice
      description: インボイスを確定します。
      operationId: submitInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /invoices/{invoiceId}/send:
    post:
      tags:
        - Invoice
      summary: Send invoice
      description: インボイスを送信します。
      operationId: sendInvoice
      parameters:
        - name: invoiceId
          description: Invoice ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '202':
          description: Accept
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/InvoiceDto'
  /terminal/locations:
    get:
      tags:
        - Terminal
      summary: List locations
      operationId: listLocations
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/LocationsResponse'
  /terminal/readers:
    get:
      tags:
        - Terminal
      summary: List readers
      operationId: listReaders
      parameters:
        - name: limit
          description: 最大件数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 検索開始位置
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/TerminalReadersResponse'
    post:
      tags:
        - Terminal
      summary: Create terminal reader
      operationId: createReader
      requestBody:
        content:
          application/json;charset=utf-8:
            schema:
              $ref: '#/components/schemas/TerminalReaderReq'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/TerminalReaderDto'
  /terminal/readers/{readerId}:
    get:
      tags:
        - Terminal
      summary: Get reader
      operationId: getReader
      parameters:
        - name: readerId
          description: Reader ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/TerminalReaderDto'
    delete:
      tags:
        - Terminal
      summary: Delete reader
      operationId: deleteReader
      parameters:
        - name: readerId
          description: Reader ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Deleted
  /disputes:
    get:
      tags:
        - Dispute
      summary: List disputes
      description: 不審請求情報を一覧で取得します
      operationId: listDisputes
      parameters:
        - name: chargeId
          description: Charge ID
          in: query
          required: false
          schema:
            type: string
        - name: from
          description: 開始時間（エポックミリ秒）、指定した時間以降に作成されたデータを取得します
          in: query
          schema:
            type: integer
            format: int64
        - name: to
          description: 終了時間（エポックミリ秒）、指定した時間以前に作成されたデータを取得します
          in: query
          schema:
            type: integer
            format: int64
        - name: dateField
          description: |
            開始時間と終了時間の項目を指定します。
            - resolved_time 不審請求解決時間
            - create_time 不審請求発生時間
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeDateTimeType'
        - name: status
          description: 不審請求ステータス
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeStatusType'
        - name: limit
          description: 最大件数
          in: query
          required: false
          schema:
            type: integer
            maximum: 100
            default: 20
        - name: offset
          description: 検索開始位置
          in: query
          schema:
            type: integer
            default: 0
        - name: sort
          description: |
            ソート項目
            - resolved_time 不審請求解決時間
            - create_time 決済新規時間
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/DisputeDateTimeType'
        - name: order
          description: |
            ソート順
            - desc 降順
            - asc 昇順
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/SortOrderType'
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/DisputesResponse'
  /disputes/{id}:
    get:
      tags:
        - Dispute
      summary: Retrieve dispute
      description: 不審請求に関する詳細情報を取得します。
      operationId: retrieveDispute
      parameters:
        - name: id
          description: Dispute ID
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json;charset=utf-8:
              schema:
                $ref: '#/components/schemas/DisputeDto'
  /subscriptions:
